openapi: 3.1.0
info:
  title: Office Room Booking API
  version: 0.1.0
  summary: Book meeting rooms in an office building.
  description: |
    Conventions:
    - Date-times are ISO 8601 in UTC, e.g. `2026-11-16T08:00:00Z`.
    - Errors use Problem Details (RFC 9457), with the media type `application/problem+json`.
    - All endpoints require a bearer token unless marked otherwise.
    - The server removes leading and trailing whitespace from names and titles before saving them.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080/api
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Registering, logging in, and the current user.
  - name: Rooms
    description: Finding rooms, their availability, and their timeline.
  - name: Equipment types
    description: The kinds of equipment a room can have.
  - name: Bookings
    description: Booking rooms, the current user's bookings, and the admin overview.
  - name: Grants
    description: Admin grants and room-access grants.
  - name: Users
    description: Users and their grants.
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: register
      summary: Create an account and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. The user is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Log in with email and password
      description: |
        Wrong email and wrong password give the same 401 response,
        so the API doesn't reveal which emails have accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: The logged-in user
      description: Used by the frontend after a page reload, to restore who is logged in from a stored token.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms:
    get:
      tags:
        - Rooms
      operationId: listRooms
      summary: Rooms the current user may book
      description: |
        Active rooms that are open to everyone, or restricted to a grant the user holds.
        Admins get every active room.
      parameters:
        - $ref: '#/components/parameters/MinCapacity'
        - $ref: '#/components/parameters/Floor'
        - $ref: '#/components/parameters/EquipmentIds'
      responses:
        '200':
          description: Matching rooms, sorted by floor and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /rooms/availability:
    get:
      tags:
        - Rooms
      operationId: searchRoomAvailability
      summary: Rooms the user may book, with availability for a time range
      description: |
        The same rooms as `GET /rooms`, each marked available or not
        for the range from `start` to `end`.
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/MinCapacity'
        - $ref: '#/components/parameters/Floor'
        - $ref: '#/components/parameters/EquipmentIds'
      responses:
        '200':
          description: Matching rooms, sorted by floor and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /rooms/{roomId}:
    get:
      tags:
        - Rooms
      operationId: getRoom
      summary: One room
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /rooms/{roomId}/bookings:
    get:
      tags:
        - Rooms
      operationId: listRoomBookings
      summary: A room's bookings on one day, for its timeline
      description: |
        Confirmed bookings that overlap the given day.
        Other people's bookings include only their times, not their titles.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: The day's bookings, sorted by start time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomBookingSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/rooms:
    get:
      tags:
        - Rooms
      operationId: listAllRooms
      summary: All rooms, including inactive ones (admin)
      responses:
        '200':
          description: All rooms, sorted by floor and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Rooms
      operationId: createRoom
      summary: Create a room (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: The created room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/rooms/{roomId}:
    put:
      tags:
        - Rooms
      operationId: updateRoom
      summary: Replace a room's details (admin)
      description: Rooms are never deleted, since bookings refer to them. Set `active` to false instead.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: The updated room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /equipment-types:
    get:
      tags:
        - Equipment types
      operationId: listEquipmentTypes
      summary: All equipment types
      responses:
        '200':
          description: All equipment types, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/equipment-types:
    post:
      tags:
        - Equipment types
      operationId: createEquipmentType
      summary: Create an equipment type (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentTypeInput'
      responses:
        '201':
          description: The created equipment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/equipment-types/{equipmentTypeId}:
    patch:
      tags:
        - Equipment types
      operationId: renameEquipmentType
      summary: Rename an equipment type (admin)
      description: Only the display name can change. The code is permanent.
      parameters:
        - $ref: '#/components/parameters/EquipmentTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentTypeRename'
      responses:
        '200':
          description: The renamed equipment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
        - Equipment types
      operationId: deleteEquipmentType
      summary: Delete an unused equipment type (admin)
      parameters:
        - $ref: '#/components/parameters/EquipmentTypeId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The equipment type is still assigned to rooms.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /booking-rules:
    get:
      tags:
        - Bookings
      operationId: getBookingRules
      summary: The rules every booking must follow
      responses:
        '200':
          description: The booking rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /bookings:
    post:
      tags:
        - Bookings
      operationId: createBooking
      summary: Book a room
      description: |
        The room must be one the user may book, and the times must follow the booking rules.
        Overlapping a confirmed booking of the same room gives 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBooking'
      responses:
        '201':
          description: The created booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The room doesn't exist, isn't active, or the user may not book it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The room is already booked at that time.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /bookings/me:
    get:
      tags:
        - Bookings
      operationId: listMyBookings
      summary: The current user's bookings
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of the user's bookings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /bookings/{bookingId}/cancel:
    post:
      tags:
        - Bookings
      operationId: cancelBooking
      summary: Cancel a booking
      description: |
        Owners can cancel their own bookings, admins any booking,
        but only while it's confirmed and hasn't started yet.
        The booking is kept, with the status CANCELLED.
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The cancelled booking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The booking is already cancelled, or has already started.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/bookings:
    get:
      tags:
        - Bookings
      operationId: listAllBookings
      summary: Everyone's bookings, with filters (admin)
      parameters:
        - $ref: '#/components/parameters/DateFilter'
        - $ref: '#/components/parameters/RoomFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of matching bookings, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBookingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/grants:
    get:
      tags:
        - Grants
      operationId: listGrants
      summary: All grants, with their holders and rooms (admin)
      responses:
        '200':
          description: All grants, system grants first, then by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Grants
      operationId: createGrant
      summary: Create a room-access grant (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
      responses:
        '201':
          description: The created grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The code or name is already used.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/grants/{grantId}:
    patch:
      tags:
        - Grants
      operationId: updateGrant
      summary: Change a grant, e.g. deactivate it (admin)
      parameters:
        - $ref: '#/components/parameters/GrantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantUpdate'
      responses:
        '200':
          description: The updated grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The name is already used, or a system grant was asked to be deactivated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users:
    get:
      tags:
        - Users
      operationId: listUsers
      summary: Users, with their grants (admin)
      parameters:
        - $ref: '#/components/parameters/UserQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of users, sorted by last name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/users/{userId}/grants/{grantId}:
    put:
      tags:
        - Users
      operationId: assignGrant
      summary: Give a user a grant (admin)
      description: Idempotent. Giving a grant the user already has also succeeds.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GrantId'
      responses:
        '204':
          description: The user has the grant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user or the grant doesn't exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      tags:
        - Users
      operationId: removeGrant
      summary: Take a grant away from a user (admin)
      description: |
        Idempotent. Removing a grant the user doesn't have also succeeds.
        Admins can't remove their own Admin grant, so nobody can lock themselves out.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/GrantId'
      responses:
        '204':
          description: The user doesn't have the grant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user or the grant doesn't exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Admins can't remove their own Admin grant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8 to 72 characters, and at most 72 bytes in UTF-8 (letters like ą or ł take 2 bytes), because bcrypt ignores everything after the 72nd byte.
    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - active
        - grantIds
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 2
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Tom
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Novak
        email:
          type: string
          format: email
          maxLength: 254
          examples:
            - tom@office.test
        active:
          type: boolean
          description: Inactive users can't log in.
        grantIds:
          type: array
          items:
            type: integer
            format: int64
          description: Ids of all grants assigned to the user, active or not.
          examples:
            - - 2
    CurrentUser:
      description: A user, plus what the frontend needs to decide what to show.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - grantCodes
          properties:
            grantCodes:
              type: array
              items:
                type: string
              description: Codes of the user's **active** grants, e.g. `ADMIN`.
              examples:
                - - ADMIN
    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
          description: 'A JWT to send as `Authorization: Bearer <accessToken>`.'
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires.
          examples:
            - 3600
        user:
          $ref: '#/components/schemas/CurrentUser'
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          examples:
            - password
        message:
          type: string
          examples:
            - Must be at least 8 characters.
    Problem:
      description: An error, in the Problem Details format (RFC 9457).
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifies the kind of problem. `about:blank` means "see the status code".
        title:
          type: string
          description: A short summary of the kind of problem.
          examples:
            - Conflict
        status:
          type: integer
          examples:
            - 409
        detail:
          type: string
          description: A human-readable explanation of this occurrence, safe to show to the user.
          examples:
            - This room is already booked at that time.
        instance:
          type: string
          format: uri-reference
          description: The request path that caused the problem.
        errors:
          type: array
          description: For validation problems, one entry per invalid field.
          items:
            $ref: '#/components/schemas/FieldError'
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 72
    Room:
      type: object
      required:
        - id
        - name
        - floor
        - capacity
        - description
        - equipmentIds
        - restricted
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Aurora
        floor:
          type: integer
          examples:
            - 1
        capacity:
          type: integer
          minimum: 1
          examples:
            - 6
        description:
          type: string
          maxLength: 1000
          description: Empty if there is none.
          examples:
            - Small meeting room by the kitchen.
        equipmentIds:
          type: array
          items:
            type: integer
            format: int64
          examples:
            - - 2
              - 3
        restricted:
          type: boolean
          description: True if only holders of certain grants may book it.
    RoomAvailability:
      type: object
      required:
        - room
        - available
      properties:
        room:
          $ref: '#/components/schemas/Room'
        available:
          type: boolean
          description: True if no confirmed booking overlaps the requested range.
    RoomBookingSlot:
      description: A booking as shown on a room's timeline.
      type: object
      required:
        - id
        - start
        - end
        - own
      properties:
        id:
          type: integer
          format: int64
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        own:
          type: boolean
          description: True if it's the current user's booking.
        title:
          type: string
          description: Only present on the current user's own bookings.
    AdminRoom:
      description: A room as admins see it, including its access settings.
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          required:
            - active
            - grantIds
          properties:
            active:
              type: boolean
              description: Inactive rooms are hidden from search and can't be booked.
            grantIds:
              type: array
              items:
                type: integer
                format: int64
              description: Grants that allow booking it. Empty means open to everyone.
    RoomInput:
      description: A room's details, as sent when creating or updating it.
      type: object
      required:
        - name
        - floor
        - capacity
        - description
        - equipmentIds
        - grantIds
        - active
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
        floor:
          type: integer
        capacity:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 1000
        equipmentIds:
          type: array
          items:
            type: integer
            format: int64
        grantIds:
          type: array
          items:
            type: integer
            format: int64
          description: Only room-access grants. Empty means open to everyone.
        active:
          type: boolean
    EquipmentType:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 1
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          examples:
            - PROJECTOR
        name:
          type: string
          examples:
            - Projector
    EquipmentTypeInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          x-pattern-message: Use uppercase letters, digits and underscores, starting with a letter.
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
    EquipmentTypeRename:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
    BookingRules:
      description: The rules every booking must follow. The backend enforces them; the frontend uses them to offer only valid choices.
      type: object
      required:
        - openTime
        - closeTime
        - stepMinutes
        - minMinutes
        - maxMinutes
        - maxDaysAhead
        - timeZone
      properties:
        openTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Earliest start time, as HH:mm in the office's time zone.
          examples:
            - '07:00'
        closeTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Latest end time, as HH:mm in the office's time zone.
          examples:
            - '20:00'
        stepMinutes:
          type: integer
          description: Start and end times must be multiples of this, counted from midnight.
          examples:
            - 15
        minMinutes:
          type: integer
          examples:
            - 15
        maxMinutes:
          type: integer
          examples:
            - 240
        maxDaysAhead:
          type: integer
          description: How many days ahead bookings may start.
          examples:
            - 30
        timeZone:
          type: string
          description: The office's IANA time zone. All the times above are in it.
          examples:
            - Europe/Warsaw
    NewBooking:
      type: object
      required:
        - roomId
        - title
        - start
        - end
      properties:
        roomId:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
        description:
          type: string
          maxLength: 2000
          default: ''
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    RoomSummary:
      description: Just enough about a room to show it, e.g. inside a booking.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          examples:
            - Aurora
    BookingStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
    Booking:
      type: object
      required:
        - id
        - room
        - title
        - description
        - start
        - end
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 42
        room:
          $ref: '#/components/schemas/RoomSummary'
        title:
          type: string
          minLength: 1
          maxLength: 200
          examples:
            - Sprint planning
        description:
          type: string
          maxLength: 2000
          description: Empty if there is none.
        start:
          type: string
          format: date-time
          examples:
            - '2026-11-17T08:00:00Z'
        end:
          type: string
          format: date-time
          examples:
            - '2026-11-17T09:00:00Z'
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
    PageMeta:
      description: Information about one page of a paginated list.
      type: object
      required:
        - page
        - size
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
          examples:
            - 1
        size:
          type: integer
          examples:
            - 20
        totalItems:
          type: integer
          description: Items across all pages.
          examples:
            - 137
        totalPages:
          type: integer
          examples:
            - 7
    BookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Booking'
    UserSummary:
      description: Just enough about a user to show who they are, e.g. inside a booking.
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
          examples:
            - Tom
        lastName:
          type: string
          examples:
            - Novak
        email:
          type: string
          format: email
          examples:
            - tom@office.test
    AdminBooking:
      description: A booking as admins see it, including who made it.
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          required:
            - user
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
    AdminBookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminBooking'
    GrantType:
      type: string
      enum:
        - SYSTEM
        - ROOM_ACCESS
      description: |
        SYSTEM grants control features, e.g. ADMIN, and are defined in code.
        ROOM_ACCESS grants control which restricted rooms a user may book, and are created by admins.
    Grant:
      type: object
      required:
        - id
        - code
        - name
        - type
        - description
        - active
      properties:
        id:
          type: integer
          format: int64
          examples:
            - 2
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Permanent. Code that checks grants uses this, never the name.
          examples:
            - IT
        name:
          type: string
          examples:
            - IT
        type:
          $ref: '#/components/schemas/GrantType'
        description:
          type: string
          description: Empty if there is none.
          examples:
            - IT department rooms
        active:
          type: boolean
          description: Holders of an inactive grant lose its access. Rooms requiring it stay restricted.
    AdminGrant:
      description: A grant with what the admin overview shows about it.
      allOf:
        - $ref: '#/components/schemas/Grant'
        - type: object
          required:
            - userCount
            - rooms
          properties:
            userCount:
              type: integer
              description: How many users hold this grant.
              examples:
                - 3
            rooms:
              type: array
              description: Rooms that require this grant. Always empty for system grants.
              items:
                $ref: '#/components/schemas/RoomSummary'
    GrantInput:
      description: A new room-access grant. System grants can't be created through the API.
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          x-pattern-message: Use uppercase letters, digits and underscores, starting with a letter.
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
        description:
          type: string
          maxLength: 500
          default: ''
    GrantUpdate:
      description: Only the fields being changed. The code and type can't change, and system grants can't be deactivated.
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*\S.*$
          x-pattern-message: Must not be blank.
        description:
          type: string
          maxLength: 500
        active:
          type: boolean
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
  responses:
    Conflict:
      description: Conflicts with the current state, e.g. an overlapping booking or a taken email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request is well-formed but invalid. See `errors` for details per field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid token, or wrong login credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Doesn't exist, or isn't visible to the current user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Logged in, but not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    MinCapacity:
      name: minCapacity
      in: query
      description: Only rooms for at least this many people.
      schema:
        type: integer
        minimum: 1
    Floor:
      name: floor
      in: query
      description: Only rooms on this floor.
      schema:
        type: integer
    EquipmentIds:
      name: equipmentId
      in: query
      description: |
        Only rooms that have all of these equipment types.
        Repeat the parameter for several, e.g. `?equipmentId=1&equipmentId=3`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64
    Start:
      name: start
      in: query
      required: true
      description: Start of the time range, as an ISO 8601 date-time.
      schema:
        type: string
        format: date-time
      example: '2026-11-17T08:00:00Z'
    End:
      name: end
      in: query
      required: true
      description: End of the time range, as an ISO 8601 date-time. Must be after `start`.
      schema:
        type: string
        format: date-time
      example: '2026-11-17T09:00:00Z'
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Date:
      name: date
      in: query
      required: true
      description: A calendar day in the office's time zone, as YYYY-MM-DD.
      schema:
        type: string
        format: date
      example: '2026-11-17'
    EquipmentTypeId:
      name: equipmentTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Scope:
      name: scope
      in: query
      required: true
      description: |
        `upcoming`: confirmed bookings that haven't ended yet, soonest first.
        `past`: bookings that have ended or were cancelled, newest first.
      schema:
        type: string
        enum:
          - upcoming
          - past
    Page:
      name: page
      in: query
      description: Which page to return, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: How many items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DateFilter:
      name: date
      in: query
      description: Only bookings on this day, in the office's time zone, as YYYY-MM-DD.
      schema:
        type: string
        format: date
    RoomFilter:
      name: roomId
      in: query
      description: Only bookings of this room.
      schema:
        type: integer
        format: int64
    StatusFilter:
      name: status
      in: query
      description: Only bookings with this status. Leave out for all.
      schema:
        $ref: '#/components/schemas/BookingStatus'
    Query:
      name: q
      in: query
      description: Only bookings whose title, or the booker's name or email, contains this text. Not case-sensitive.
      schema:
        type: string
        maxLength: 100
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserQuery:
      name: q
      in: query
      description: Only users whose name or email contains this text. Not case-sensitive.
      schema:
        type: string
        maxLength: 100
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
