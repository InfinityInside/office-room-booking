openapi: 3.1.0

info:
  title: Office Room Booking API
  version: 0.1.0
  summary: Book meeting rooms in an office building.
  description: |
    Conventions:
    - Date-times are ISO 8601 in UTC, e.g. `2026-11-16T08:00:00Z`.
    - Errors use Problem Details (RFC 9457), with the media type `application/problem+json`.
    - All endpoints require a bearer token unless marked otherwise.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080/api
    description: Local backend

tags:
  - name: Auth
    description: Registering, logging in, and the current user.
  - name: Rooms
    description: Finding rooms, their availability, and their timeline.
  - name: Equipment types
    description: The kinds of equipment a room can have.

# Secure by default: every endpoint requires a token unless it says `security: []`.
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. The user is logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /auth/login:
    post:
      tags: [ Auth ]
      operationId: login
      summary: Log in with email and password
      description: |
        Wrong email and wrong password give the same 401 response,
        so the API doesn't reveal which emails have accounts.
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /auth/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      summary: The logged-in user
      description: Used by the frontend after a page reload, to restore who is logged in from a stored token.
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms:
    get:
      tags: [ Rooms ]
      operationId: listRooms
      summary: Rooms the current user may book
      description: |
        Active rooms that are open to everyone, or restricted to a grant the user holds.
        Admins get every active room.
      parameters:
        - $ref: '#/components/parameters/MinCapacity'
        - $ref: '#/components/parameters/Floor'
        - $ref: '#/components/parameters/EquipmentIds'
      responses:
        '200':
          description: Matching rooms, sorted by floor and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rooms/availability:
    get:
      tags: [ Rooms ]
      operationId: searchRoomAvailability
      summary: Rooms the user may book, with availability for a time range
      description: |
        The same rooms as `GET /rooms`, each marked available or not
        for the range from `start` to `end`.
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/MinCapacity'
        - $ref: '#/components/parameters/Floor'
        - $ref: '#/components/parameters/EquipmentIds'
      responses:
        '200':
          description: Matching rooms, sorted by floor and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /rooms/{roomId}:
    get:
      tags: [Rooms]
      operationId: getRoom
      summary: One room
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rooms/{roomId}/bookings:
    get:
      tags: [Rooms]
      operationId: listRoomBookings
      summary: A room's bookings on one day, for its timeline
      description: |
        Confirmed bookings that overlap the given day.
        Other people's bookings include only their times, not their titles.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: The day's bookings, sorted by start time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomBookingSlot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /equipment-types:
    get:
      tags: [Equipment types]
      operationId: listEquipmentTypes
      summary: All equipment types
      responses:
        '200':
          description: All equipment types, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EquipmentType'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/rooms:
    get:
      tags: [Rooms]
      operationId: listAllRooms
      summary: All rooms, including inactive ones (admin)
      responses:
        '200':
          description: All rooms, sorted by floor and name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Create a room (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '201':
          description: The created room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/rooms/{roomId}:
    put:
      tags: [Rooms]
      operationId: updateRoom
      summary: Replace a room's details (admin)
      description: Rooms are never deleted, since bookings refer to them. Set `active` to false instead.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomInput'
      responses:
        '200':
          description: The updated room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRoom'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/equipment-types:
    post:
      tags: [Equipment types]
      operationId: createEquipmentType
      summary: Create an equipment type (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentTypeInput'
      responses:
        '201':
          description: The created equipment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /admin/equipment-types/{equipmentTypeId}:
    patch:
      tags: [Equipment types]
      operationId: renameEquipmentType
      summary: Rename an equipment type (admin)
      description: Only the display name can change. The code is permanent.
      parameters:
        - $ref: '#/components/parameters/EquipmentTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentTypeRename'
      responses:
        '200':
          description: The renamed equipment type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Equipment types]
      operationId: deleteEquipmentType
      summary: Delete an unused equipment type (admin)
      parameters:
        - $ref: '#/components/parameters/EquipmentTypeId'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The equipment type is still assigned to rooms.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EquipmentTypeId:
      name: equipmentTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Start:
      name: start
      in: query
      required: true
      description: Start of the time range, as an ISO 8601 date-time.
      schema:
        type: string
        format: date-time
      example: '2026-11-17T08:00:00Z'
    End:
      name: end
      in: query
      required: true
      description: End of the time range, as an ISO 8601 date-time. Must be after `start`.
      schema:
        type: string
        format: date-time
      example: '2026-11-17T09:00:00Z'
    Date:
      name: date
      in: query
      required: true
      description: A calendar day in the office's time zone, as YYYY-MM-DD.
      schema:
        type: string
        format: date
      example: '2026-11-17'
    MinCapacity:
      name: minCapacity
      in: query
      description: Only rooms for at least this many people.
      schema:
        type: integer
        minimum: 1
    Floor:
      name: floor
      in: query
      description: Only rooms on this floor.
      schema:
        type: integer
    EquipmentIds:
      name: equipmentId
      in: query
      description: |
        Only rooms that have all of these equipment types.
        Repeat the parameter for several, e.g. `?equipmentId=1&equipmentId=3`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int64

  schemas:
    User:
      type: object
      required: [ id, firstName, lastName, email, active, grantIds ]
      properties:
        id:
          type: integer
          format: int64
          examples: [ 2 ]
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          examples: [ Tom ]
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          examples: [ Novak ]
        email:
          type: string
          format: email
          maxLength: 254
          examples: [ tom@office.test ]
        active:
          type: boolean
          description: Inactive users can't log in.
        grantIds:
          type: array
          items:
            type: integer
            format: int64
          description: Ids of all grants assigned to the user, active or not.
          examples: [ [ 2 ] ]

    CurrentUser:
      description: A user, plus what the frontend needs to decide what to show.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [ grantCodes ]
          properties:
            grantCodes:
              type: array
              items:
                type: string
              description: Codes of the user's **active** grants, e.g. `ADMIN`.
              examples: [ [ ADMIN ] ]

    RegisterRequest:
      type: object
      required: [ firstName, lastName, email, password ]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    AuthResponse:
      type: object
      required: [ accessToken, tokenType, expiresIn, user ]
      properties:
        accessToken:
          type: string
          description: 'A JWT to send as `Authorization: Bearer <accessToken>`.'
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires.
          examples: [ 3600 ]
        user:
          $ref: '#/components/schemas/CurrentUser'

    Problem:
      description: An error, in the Problem Details format (RFC 9457).
      type: object
      required: [ title, status ]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: Identifies the kind of problem. `about:blank` means "see the status code".
        title:
          type: string
          description: A short summary of the kind of problem.
          examples: [ Conflict ]
        status:
          type: integer
          examples: [ 409 ]
        detail:
          type: string
          description: A human-readable explanation of this occurrence, safe to show to the user.
          examples: [ This room is already booked at that time. ]
        instance:
          type: string
          format: uri-reference
          description: The request path that caused the problem.
        errors:
          type: array
          description: For validation problems, one entry per invalid field.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [ field, message ]
      properties:
        field:
          type: string
          examples: [ password ]
        message:
          type: string
          examples: [ Must be at least 8 characters. ]

    Room:
      type: object
      required: [ id, name, floor, capacity, description, equipmentIds, restricted ]
      properties:
        id:
          type: integer
          format: int64
          examples: [ 1 ]
        name:
          type: string
          minLength: 1
          maxLength: 100
          examples: [ Aurora ]
        floor:
          type: integer
          examples: [ 1 ]
        capacity:
          type: integer
          minimum: 1
          examples: [ 6 ]
        description:
          type: string
          maxLength: 1000
          description: Empty if there is none.
          examples: [ 'Small meeting room by the kitchen.' ]
        equipmentIds:
          type: array
          items:
            type: integer
            format: int64
          examples: [ [ 2, 3 ] ]
        restricted:
          type: boolean
          description: True if only holders of certain grants may book it.

    AdminRoom:
      description: A room as admins see it, including its access settings.
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          required: [ active, grantIds ]
          properties:
            active:
              type: boolean
              description: Inactive rooms are hidden from search and can't be booked.
            grantIds:
              type: array
              items:
                type: integer
                format: int64
              description: Grants that allow booking it. Empty means open to everyone.

    RoomInput:
      description: A room's details, as sent when creating or updating it.
      type: object
      required: [ name, floor, capacity, description, equipmentIds, grantIds, active ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        floor:
          type: integer
        capacity:
          type: integer
          minimum: 1
        description:
          type: string
          maxLength: 1000
        equipmentIds:
          type: array
          items:
            type: integer
            format: int64
        grantIds:
          type: array
          items:
            type: integer
            format: int64
          description: Only room-access grants. Empty means open to everyone.
        active:
          type: boolean

    RoomAvailability:
      type: object
      required: [ room, available ]
      properties:
        room:
          $ref: '#/components/schemas/Room'
        available:
          type: boolean
          description: True if no confirmed booking overlaps the requested range.

    RoomBookingSlot:
      description: A booking as shown on a room's timeline.
      type: object
      required: [ id, start, end, own ]
      properties:
        id:
          type: integer
          format: int64
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        own:
          type: boolean
          description: True if it's the current user's booking.
        title:
          type: string
          description: Only present on the current user's own bookings.

    EquipmentType:
      type: object
      required: [ id, code, name ]
      properties:
        id:
          type: integer
          format: int64
          examples: [ 1 ]
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [ PROJECTOR ]
        name:
          type: string
          examples: [ Projector ]

    EquipmentTypeInput:
      type: object
      required: [ code, name ]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 50
          description: Permanent. Uppercase letters, digits and underscores, starting with a letter.
        name:
          type: string
          minLength: 1
          maxLength: 100

    EquipmentTypeRename:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

  responses:
    Unauthorized:
      description: Missing or invalid token, or wrong login credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Logged in, but not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Doesn't exist, or isn't visible to the current user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with the current state, e.g. an overlapping booking or a taken email.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request is well-formed but invalid. See `errors` for details per field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'