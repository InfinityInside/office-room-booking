BookingStatus:
  type: string
  enum: [CONFIRMED, CANCELLED]

Booking:
  type: object
  required: [id, room, title, description, start, end, status, createdAt]
  properties:
    id:
      type: integer
      format: int64
      examples: [42]
    room:
      $ref: '../rooms/schemas.yaml#/RoomSummary'
    title:
      type: string
      minLength: 1
      maxLength: 200
      examples: [Sprint planning]
    description:
      type: string
      maxLength: 2000
      description: Empty if there is none.
    start:
      type: string
      format: date-time
      examples: ['2026-11-17T08:00:00Z']
    end:
      type: string
      format: date-time
      examples: ['2026-11-17T09:00:00Z']
    status:
      $ref: '#/BookingStatus'
    createdAt:
      type: string
      format: date-time

AdminBooking:
  description: A booking as admins see it, including who made it.
  allOf:
    - $ref: '#/Booking'
    - type: object
      required: [user]
      properties:
        user:
          $ref: '../auth/schemas.yaml#/UserSummary'

NewBooking:
  type: object
  required: [roomId, title, start, end]
  properties:
    roomId:
      type: integer
      format: int64
    title:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^.*\S.*$'
      x-pattern-message: Must not be blank.
    description:
      type: string
      maxLength: 2000
      default: ''
    start:
      type: string
      format: date-time
    end:
      type: string
      format: date-time

BookingPage:
  allOf:
    - $ref: '../common/schemas.yaml#/PageMeta'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/Booking'

AdminBookingPage:
  allOf:
    - $ref: '../common/schemas.yaml#/PageMeta'
    - type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/AdminBooking'

BookingRules:
  description: The rules every booking must follow. The backend enforces them; the frontend uses them to offer only valid choices.
  type: object
  required: [openTime, closeTime, stepMinutes, minMinutes, maxMinutes, maxDaysAhead, timeZone]
  properties:
    openTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Earliest start time, as HH:mm in the office's time zone.
      examples: ['07:00']
    closeTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: Latest end time, as HH:mm in the office's time zone.
      examples: ['20:00']
    stepMinutes:
      type: integer
      description: Start and end times must be multiples of this, counted from midnight.
      examples: [15]
    minMinutes:
      type: integer
      examples: [15]
    maxMinutes:
      type: integer
      examples: [240]
    maxDaysAhead:
      type: integer
      description: How many days ahead bookings may start.
      examples: [30]
    timeZone:
      type: string
      description: The office's IANA time zone. All the times above are in it.
      examples: [Europe/Warsaw]