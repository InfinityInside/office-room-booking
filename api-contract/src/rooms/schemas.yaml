Room:
  type: object
  required: [id, name, floor, capacity, description, equipmentIds, restricted]
  properties:
    id:
      type: integer
      format: int64
      examples: [1]
    name:
      type: string
      minLength: 1
      maxLength: 100
      examples: [Aurora]
    floor:
      type: integer
      examples: [1]
    capacity:
      type: integer
      minimum: 1
      examples: [6]
    description:
      type: string
      maxLength: 1000
      description: Empty if there is none.
      examples: ['Small meeting room by the kitchen.']
    equipmentIds:
      type: array
      items:
        type: integer
        format: int64
      examples: [[2, 3]]
    restricted:
      type: boolean
      description: True if only holders of certain grants may book it.

AdminRoom:
  description: A room as admins see it, including its access settings.
  allOf:
    - $ref: '#/Room'
    - type: object
      required: [active, grantIds]
      properties:
        active:
          type: boolean
          description: Inactive rooms are hidden from search and can't be booked.
        grantIds:
          type: array
          items:
            type: integer
            format: int64
          description: Grants that allow booking it. Empty means open to everyone.

RoomInput:
  description: A room's details, as sent when creating or updating it.
  type: object
  required: [name, floor, capacity, description, equipmentIds, grantIds, active]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^.*\S.*$'
      x-pattern-message: Must not be blank.
    floor:
      type: integer
    capacity:
      type: integer
      minimum: 1
    description:
      type: string
      maxLength: 1000
    equipmentIds:
      type: array
      items:
        type: integer
        format: int64
    grantIds:
      type: array
      items:
        type: integer
        format: int64
      description: Only room-access grants. Empty means open to everyone.
    active:
      type: boolean

RoomAvailability:
  type: object
  required: [room, available]
  properties:
    room:
      $ref: '#/Room'
    available:
      type: boolean
      description: True if no confirmed booking overlaps the requested range.

RoomBookingSlot:
  description: A booking as shown on a room's timeline.
  type: object
  required: [id, start, end, own]
  properties:
    id:
      type: integer
      format: int64
    start:
      type: string
      format: date-time
    end:
      type: string
      format: date-time
    own:
      type: boolean
      description: True if it's the current user's booking.
    title:
      type: string
      description: Only present on the current user's own bookings.

RoomSummary:
  description: Just enough about a room to show it, e.g. inside a booking.
  type: object
  required: [id, name]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      examples: [Aurora]