name: office-room-booking

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flyway:
    image: flyway/flyway:13
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      # Schema migrations, plus demo data (development only)
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
    volumes:
      - ./database/migrations:/flyway/sql:ro
      - ./database/seed:/flyway/seed:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: