spring:
  application:
    name: backend-spring

  web:
    locale: en
    locale-resolver: fixed

  # Local development: read the repo's .env file (the same one Docker Compose uses).
  # Real environment variables always win over it, e.g. in Docker or production.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # The schema belongs to the shared migrations, run by the Flyway container in Compose.
  # This backend never migrates the database itself; only the tests turn this on.
  flyway:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    expires-in: 1h